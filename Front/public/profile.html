<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="styles/styleProfile.css">
</head>
<body>
    <header>
        <nav class="nav-bar">
            <ul>
                <li><a href="#" onclick="filterCamisetas('Manga Corta')">Manga Corta</a></li>
                <li><a href="#" onclick="filterCamisetas('Manga Larga')">Manga Larga</a></li>
                <li><a href="#" onclick="filterCamisetas('Corte de Mujer')">Corte de Mujer</a></li>
                <li><a href="#" onclick="filterCamisetas('Sin Mangas')">Sin Mangas</a></li>
                <li><a href="#" onclick="filterCamisetas('Tirantes')">Tirantes</a></li>
                <li><a href="#" onclick="filterCamisetas('Jerseys')">Jerseys</a></li>
            </ul>
            <a href="cart.html">
                <img src="images/carrito.svg" alt="Carrito" class="carrito-icono" id="carrito-icono">
            </a>
            <a href="index.html">
                <img src="images/home.svg" alt="Home" class="home-icono" id="home-icono">
            </a>
        </nav>
    </header>

    <div class="container">
        <div class="profile-container">
            <h2>Perfil de Usuario</h2>
            <form id="profileForm">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" required>

                <label for="surname">Apellido</label>
                <input type="text" id="surname" name="surname" required>

                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>

                <label for="birthDate">Fecha de Nacimiento</label>
                <input type="date" id="birthDate" name="birthDate" required>

                <button type="submit">Cambiar Contraseña</button>
                <button type="submit">Guardar Cambios</button>

            </form>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 Tu Tienda de Camisetas. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script type="module" src="scripts/profile.js"></script>
    <script type="module" src="scripts/session.js"></script>
</body>
</html>
